
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IBM Online Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="text-primary">Welcome to IBM Online Course</h1>
        <p class="lead">Learn new skills with our online courses.</p>
    </div>

    <h3>Available Courses</h3>

    <div class="row mt-3">
        {% for course in courses %}
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm p-3">
                <h4>{{ course.name }}</h4>
                <p>{{ course.description }}</p>
                <a href="{% url 'onlinecourse:course_details' course.id %}"
                   class="btn btn-primary">
                    View Course
                </a>
            </div>
        </div>
        {% empty %}
        <div class="alert alert-info">
            No courses available. Please add a course from the admin panel.
        </div>
        {% endfor %}
    </div>

    <a href="/admin/" class="btn btn-dark mt-3">Admin Login</a>
</div>

</body>
</html>
