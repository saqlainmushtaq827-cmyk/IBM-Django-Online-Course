
<form method="POST"
      action="{% url 'onlinecourse:submit' lesson.course.id %}">

    {% csrf_token %}

    {% for question in lesson.questions.all %}

    <div class="card mb-3">
        <div class="card-body">

            <h5>{{ forloop.counter }}. {{ question.question_text }}</h5>

            {% for choice in question.choices.all %}

            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="choice"
                       value="{{ choice.id }}"
                       id="choice{{ choice.id }}">

                <label class="form-check-label"
                       for="choice{{ choice.id }}">
                    {{ choice.choice_text }}
                </label>
            </div>

            {% endfor %}

        </div>
    </div>

    {% endfor %}

    <button type="submit" class="btn btn-success">
        Submit Exam
    </button>

</form>
